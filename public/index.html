<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeRouter Chatbot Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>FreeRouter Chatbot Demo</h1>
      <p class="sub">One API key. Zero lock-in. This chatbot runs on FreeRouter — and swaps to OpenRouter with two env vars. <a href="https://github.com/niyogi/freerouter-demo-app" target="_blank" rel="noopener">Demo source</a> · <a href="https://freerouter.com" target="_blank" rel="noopener">Get your free key on FreeRouter</a></p>
      <p class="pill" id="provider-pill">Connecting…</p>
    </header>

    <div class="controls" id="controls">
      <fieldset class="seg" id="shape-seg">
        <legend>API shape</legend>
        <label class="seg-opt"><input type="radio" name="shape" value="chat" checked /> Chat Completions</label>
        <label class="seg-opt"><input type="radio" name="shape" value="responses" /> Responses</label>
      </fieldset>
      <label class="stream-toggle"><input type="checkbox" id="stream" checked /> Stream</label>
      <button type="button" class="newchat" id="new-chat">New chat</button>
    </div>

    <section class="chat" id="messages" aria-live="polite"></section>

    <form class="composer" id="composer">
      <input id="input" type="text" placeholder="Ask anything…" autocomplete="off" maxlength="2000" />
      <button type="submit" id="send">Send</button>
    </form>

    <div class="chips">
      <button type="button" class="chip">What is the best tennis racket under $100?</button>
      <button type="button" class="chip">Which no-code platforms let me start building a website for free?</button>
      <button type="button" class="chip">Which airlines fly out of Austin?</button>
      <button type="button" class="chip">What AI-powered e-mail productivity tools should I consider?</button>
    </div>
    <p class="hint">Powered by <span id="hint-host">FreeRouter</span> · model <code id="hint-model">…</code> · your key stays on the server.</p>
  </main>
  <script src="/vendor/markdown-it.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
